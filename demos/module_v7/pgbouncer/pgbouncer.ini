; Clip V7.2: PgBouncer in transaction mode, for the lab only.
; The container shares the network namespace of the lab container: PgBouncer listens on
; 127.0.0.1:6432 inside it and reaches PostgreSQL on 127.0.0.1:5432, where the lab's
; pg_hba.conf trusts local connections. Nothing leaves the container, no port is opened.
[databases]
; Every database of the lab, through pools of two server connections at most.
* = host=127.0.0.1 port=5432
; One pool of a single server connection, to make the sharing of a session visible.
pdf_one = host=127.0.0.1 port=5432 dbname=pachadataformation pool_size=1

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
; Lab only: no password between psql and PgBouncer. In production, scram-sha-256 and TLS.
auth_type = trust
auth_file = /tmp/userlist.txt
admin_users = postgres
pool_mode = transaction
default_pool_size = 2
max_client_conn = 200
